name: Publish RNA dashboard
on:
  push:
    branches: [main]
    paths:
      - 'RNA_Dashboard_GitHub_Ready.zip'
      - 'map-release.patch'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare dashboard files
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil
          output = Path("_site")
          output.mkdir()
          if Path("docs/index.html").is_file():
              shutil.copytree("docs", output, dirs_exist_ok=True)
          else:
              with ZipFile("RNA_Dashboard_GitHub_Ready.zip") as archive:
                  for item in archive.infolist():
                      path = PurePosixPath(item.filename)
                      if path.is_absolute() or ".." in path.parts:
                          raise ValueError("Unsafe archive path")
                      if not path.parts or path.parts[0] != "docs" or item.is_dir():
                          continue
                      target = output.joinpath(*path.parts[1:])
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(item))
          assert (output / "index.html").is_file(), "Missing dashboard homepage"
          assert (output / "data/idai-event.json").is_file(), "Missing sample event"
          print("Dashboard files prepared")
      - name: Build and check map release
        run: |
          cd _site
          mkdir -p _build
          patch --batch --forward -p1 < ../map-release.patch
          python _build/split_sample.py .
          python _build/build_observed_tiles.py .
          rm -r _build
          node --check app.js
          node --check workflow.js
          node --check observed-tiles.js
          python - <<'PYTHON'
          from pathlib import Path
          import hashlib
          page = Path('index.html')
          html = page.read_text()
          heading = '<p class="eyebrow">24-HOUR EVENT BRIEFING</p>'
          credit = '<p class="developer-credit">Developed with <span role="img" aria-label="love">❤️</span> by <strong>Duncan Kebut</strong></p>'
          html = html.replace(heading, '').replace(credit, '').replace('Fine-tune assessment', 'Assess')
          sample_note = 'Historical sample · replace with your event data.'
          for filename in ('app.js', 'workflow.js', 'downloads/Event_Guide.md', 'downloads/Event_Template.json'):
              path = Path(filename)
              source = path.read_text()
              path.write_text(source.replace(sample_note, '').replace('Fine-tune assessment', 'Assess'))
          for name in ('app.js','workflow.js','style.css','observed-tiles.js'):
              path = Path(name)
              tag = hashlib.sha256(path.read_bytes()).hexdigest()[:12]
              dest = path.with_name(f'{path.stem}-{tag}{path.suffix}')
              dest.write_bytes(path.read_bytes())
              assert f'"{name}"' in html, name
              html = html.replace(f'"{name}"', f'"{dest.name}"')
          page.write_text(html)
          PYTHON
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4


